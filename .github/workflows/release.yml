name: Release

# Every push to main becomes a release. The version is 1.0.<run number>, which always
# goes up and never has to be decided — Velopack only cares that it increases.
#
# Put [skip release] in the commit's subject line to push without building one. Only
# the subject is read: a commit body that merely mentions the phrase — this file's own
# history, for instance — should not stop a release.
#
# Each platform has to be packaged on itself — Velopack builds a Windows installer only
# on Windows, and needs macOS's own tools for a .app bundle — so the matrix is three real
# runners rather than one cross-compiling.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes in quick succession queue rather than race. Cancelling a half-finished
# release would leave some platforms published and others not.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Is this one to release?
        id: gate
        run: |
          subject=$(git log -1 --pretty=%s)
          echo "subject: $subject"
          if [[ "$subject" == *"[skip release]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Nothing ships that the suite has not passed, including on a machine that has
      # never seen a real directory — those tests skip rather than fail.
      - run: dotnet test --configuration Release

  package:
    needs: test
    if: needs.test.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
          - os: macos-latest
            runtime: osx-arm64
          # No Intel Mac build: those runners now queue for a long time and often never
          # start, holding up every release for a machine nobody here is using. Add
          # `{ os: macos-13, runtime: osx-x64 }` back if somebody turns out to need it.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the packaging tool
        run: dotnet tool install -g vpk

      - name: Publish
        run: >
          dotnet publish src/YoursTruly.App
          -c Release
          -r ${{ matrix.runtime }}
          -o publish
          -p:Version=${{ needs.test.outputs.version }}

      - name: Package for Windows
        if: startsWith(matrix.runtime, 'win')
        run: >
          vpk pack
          --packId YoursTruly
          --packVersion ${{ needs.test.outputs.version }}
          --packDir publish
          --mainExe YoursTruly.App.exe
          --packTitle "Yours Truly"
          --icon assets/yourstruly.ico
          --runtime ${{ matrix.runtime }}

      - name: Package for macOS
        if: startsWith(matrix.runtime, 'osx')
        run: >
          vpk pack
          --packId YoursTruly
          --packVersion ${{ needs.test.outputs.version }}
          --packDir publish
          --mainExe YoursTruly.App
          --packTitle "Yours Truly"
          --icon assets/yourstruly.icns
          --runtime ${{ matrix.runtime }}

      - name: Package for Linux
        if: startsWith(matrix.runtime, 'linux')
        run: >
          vpk pack
          --packId YoursTruly
          --packVersion ${{ needs.test.outputs.version }}
          --packDir publish
          --mainExe YoursTruly.App
          --packTitle "Yours Truly"
          --icon assets/yourstruly.png
          --runtime ${{ matrix.runtime }}

      - uses: actions/upload-artifact@v4
        with:
          name: yourstruly-${{ matrix.runtime }}
          path: Releases/*

  publish:
    needs: [test, package]
    if: needs.test.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # A GitHub release is a flat list of files — there are no folders to tidy things
      # into — so the only way to keep the page readable is to publish less. Three kinds
      # of file come out of packaging:
      #
      #   * the installers, which are what anybody visiting the page wants;
      #   * releases.<channel>.json and the .nupkg beside it, which ARE the auto-update
      #     feed. The running app fetches them to work out whether there is anything
      #     newer. They have to sit on the latest release or every installed copy stops
      #     updating, so they stay however untidy they look;
      #   * RELEASES, RELEASES-linux, RELEASES-osx and assets.<channel>.json, which
      #     nothing reads. The first three are Squirrel-era compatibility files and this
      #     app has only ever shipped on Velopack 1.x; the last are notes for `vpk
      #     upload`, which this workflow does not use. Velopack.dll contains no mention
      #     of either name.
      #
      # Only the third kind is dropped. Checked rather than assumed: with v1.0.7
      # published without them, GithubSource.GetReleaseFeed still resolves 1.0.7 on all
      # three channels. If an update ever does fail to be found, they are still the
      # first thing to put back.
      - name: Gather everything into one folder
        run: |
          mkdir -p Releases
          find artifacts -type f -exec cp -n {} Releases/ \;
          rm -f Releases/RELEASES Releases/RELEASES-linux Releases/RELEASES-osx
          rm -f Releases/assets.*.json
          ls -la Releases

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.test.outputs.version }}
          name: Yours Truly ${{ needs.test.outputs.version }}
          files: Releases/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # Named downloads at the top, so nobody has to guess which of the files below
          # is the one for them. The generated notes are appended underneath this.
          body: |
            ### Download

            | | |
            | --- | --- |
            | **Windows** | [YoursTruly-win-Setup.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.test.outputs.version }}/YoursTruly-win-Setup.exe) |
            | **macOS** (Apple Silicon) | [YoursTruly-osx-Setup.pkg](${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.test.outputs.version }}/YoursTruly-osx-Setup.pkg) |
            | **Linux** | [YoursTruly.AppImage](${{ github.server_url }}/${{ github.repository }}/releases/download/v${{ needs.test.outputs.version }}/YoursTruly.AppImage) |

            There are also `-Portable.zip` builds for Windows and macOS that run from a
            folder without installing anything.

            Yours Truly updates itself after this — you only download by hand once.

            <details>
            <summary>The installer is not signed, so your computer will warn you</summary>

            Signing costs an Apple or Microsoft developer account, and this is a personal
            app, so it does not have one. Nothing about the warning says the app is
            unsafe — only that nobody has paid to vouch for it. The source is all here
            and the release is built by GitHub from it.

            **macOS:** double-clicking the `.pkg` gives "Apple could not verify this is
            free of malware". Open **System Settings → Privacy & Security**, find the
            blocked item near the bottom, click **Open Anyway**, then run the installer
            again. Or in Terminal:
            `xattr -dr com.apple.quarantine ~/Downloads/YoursTruly-osx-Setup.pkg`

            **Windows:** SmartScreen shows "Windows protected your PC". Click **More
            info**, then **Run anyway**.

            </details>

            <details>
            <summary>What the other files are</summary>

            `releases.*.json` and the `.nupkg` files are how the app checks for and
            downloads its own updates. They are not for downloading by hand.

            </details>
